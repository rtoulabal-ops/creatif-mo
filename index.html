<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Créatif</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<h1>Studio Créatif</h1>
<p class="sub">Génération · Templates pro</p>

<div class="box ok" id="apiBox">
  <label class="lbl">Clé API Agnès</label>
  <input type="password" id="apiKeyInput" placeholder="sk-...">
  <div style="display:flex; gap:0.5rem;">
    <button id="saveKeyBtn" style="flex:1;">Enregistrer la clé</button>
    <button id="testKeyBtn" style="flex:1; background:#7c3aed;">Tester la clé</button>
  </div>
  <div class="diag" id="apiDiag">Initialisation du script...</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="p1">📖 Histoire</div>
  <div class="tab" data-tab="p2">🎯 Templates</div>
  <div class="tab" data-tab="p3">🎬 Vidéos</div>
</div>

<div class="panel active" id="p1">
  <div class="box">
    <label class="lbl">Titre de l'histoire</label>
    <input type="text" id="storyTitle" placeholder="Ex: Course poursuite à Paris">
  </div>
  <div class="box">
    <label class="lbl">Durée par vidéo</label>
    <select id="storyDuration">
      <option value="4">4 secondes</option>
      <option value="6" selected>6 secondes</option>
      <option value="8">8 secondes</option>
      <option value="10">10 secondes</option>
      <option value="12">12 secondes</option>
    </select>
  </div>
  <div class="box">
    <label class="lbl">Style visuel</label>
    <select id="globalStyle">
      <option value="realistic" selected>📸 Réaliste photographie pro</option>
      <option value="ghibli">🌿 Studio Ghibli</option>
      <option value="anime">🗾 Anime japonaise</option>
      <option value="pixar">✨ Pixar 3D</option>
      <option value="disney">🏰 Disney 2D</option>
      <option value="cartoon">🎨 Cartoon 2D</option>
      <option value="netflix">🎬 Netflix cinématique</option>
    </select>
  </div>
  <div class="diag" id="log">Prêt.</div>
  <div id="scenesList"></div>
  <button id="addSceneBtn">＋ Ajouter une scène</button>
  <button class="purple" id="generateBtn" disabled>🎬 Générer l'histoire</button>
  <button id="stopBtn" style="display:none;background:#fff;color:#c0392b;border:1px solid #c0392b">⏹ Arrêter</button>
  <div class="timer" id="timerBox">
    <div class="tv" id="timerVal">00:00</div>
    <div class="tl" id="timerLbl">Prêt</div>
    <div class="pb"><div class="pb-f" id="progressFill"></div></div>
  </div>
</div>

<div class="panel" id="p2">
  <div class="box">
    <div class="empty">Bibliothèque de prompts (bientôt disponible)</div>
  </div>
</div>

<div class="panel" id="p3">
  <div class="box">
    <label class="lbl">Vidéos générées</label>
    <div class="gallery" id="gallery"><div class="empty">Aucune vidéo</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- C'EST ICI QU'ON CHARGE LE BON SCRIPT -->
<script src="script_v2.js"></script>
</body>
  </html>
