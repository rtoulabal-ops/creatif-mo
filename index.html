<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studio Créatif</title>
<style>
:root{
  --bg:#0f1117;--bg2:#161a23;--ln:#242a37;--ink:#e8ecf3;--dim:#8b94a7;
  --a:#7c3aed;--a2:#a78bfa;--ok:#10b981;--er:#ef4444;--wr:#f59e0b;
  --m:ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:20px 16px 60px;max-width:920px;margin:0 auto}
h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin-bottom:2px}
p.sub{color:var(--dim);font-size:13px;margin-bottom:20px}
.box{background:var(--bg2);border:1px solid var(--ln);border-radius:12px;padding:16px;margin-bottom:14px}
.box.ok{border-color:#2a3a55}
.lbl{display:block;font:11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;font:14px var(--m);padding:10px 12px;border:1px solid var(--ln);
  background:#0c0f16;color:var(--ink);border-radius:8px;outline:0;transition:.15s
}
input:focus,select:focus,textarea:focus{border-color:var(--a);background:#0a0d13}
textarea{resize:vertical;min-height:90px}
button{font:600 13px var(--m);letter-spacing:.04em;padding:10px 16px;border:1px solid var(--ln);
  background:#1c2130;color:var(--ink);border-radius:8px;cursor:pointer;transition:.15s}
button:hover:not(:disabled){background:#252c3d;border-color:#3a4255}
button:disabled{opacity:.4;cursor:not-allowed}
button.purple{background:var(--a);border-color:var(--a);color:#fff}
button.purple:hover:not(:disabled){background:#6d28d9;border-color:#6d28d9}
.diag{font:12px var(--m);color:var(--dim);background:#0a0d13;border:1px solid var(--ln);
  border-radius:8px;padding:10px 12px;margin-top:10px;max-height:140px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.diag.ok{color:var(--ok);border-color:#1e3a2f;background:#0c1a15}
.diag.er{color:#ff8a8a;border-color:#3a1e1e;background:#1a0c0c}
.diag.wr{color:var(--wr);border-color:#3a2f1e;background:#1a150c}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font:600 13px var(--m);padding:9px 14px;border:1px solid var(--ln);background:var(--bg2);
  color:var(--dim);border-radius:8px;cursor:pointer;transition:.15s}
.tab:hover{color:var(--ink);border-color:#3a4255}
.tab.active{background:var(--a);color:#fff;border-color:var(--a)}
.panel{display:none}
.panel.active{display:block}
.empty{text-align:center;color:var(--dim);font:13px var(--m);padding:24px;border:1px dashed var(--ln);border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>*{flex:1;min-width:0}
.timer{margin-top:14px;padding:14px;background:#0a0d13;border:1px solid var(--ln);border-radius:10px}
.tv{font:800 28px var(--m);letter-spacing:.08em;color:var(--a2)}
.tl{font:11px var(--m);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:10px}
.pb{height:6px;background:var(--ln);border-radius:3px;overflow:hidden;margin-top:8px}
.pb-f{height:100%;background:linear-gradient(90deg,var(--a),var(--a2));width:0;transition:width .4s}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast>div{background:#1c2130;border:1px solid var(--ln);color:#fff;font:12px var(--m);padding:9px 16px;border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.4);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* Scènes */
.scene{background:#0a0d13;border:1px solid var(--ln);border-radius:10px;padding:12px;margin-bottom:10px;position:relative}
.scene .del{position:absolute;top:8px;right:8px;padding:2px 8px;font-size:11px;background:transparent;border-color:var(--er);color:#ff8a8a}
.scene .num{font:11px var(--m);letter-spacing:.1em;color:var(--a2);text-transform:uppercase;margin-bottom:8px}
.scene label{display:block;margin-top:8px}
.scene label>span{display:block;font:10px var(--m);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin-bottom:4px}
/* Galerie vidéos */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.gal{background:#0a0d13;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.gal video,.gal img{width:100%;display:block;background:#000;aspect-ratio:16/9;object-fit:cover}
.gal .meta{padding:8px 10px;font:11px var(--m);color:var(--dim)}
/* --- Studio Image --- */
.drop{display:block;border:2px dashed var(--ln);background:#0a0d13;padding:20px;text-align:center;
  border-radius:10px;cursor:pointer;transition:.15s;margin:8px 0}
.drop:hover{border-color:var(--a);background:#0e1220}
.drop b{display:block;font:600 14px system-ui;margin-bottom:4px;color:var(--ink)}
.drop small{color:var(--dim);font-size:12px}
.thumbs{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}
.tw{position:relative;width:96px;height:96px;border:1px solid var(--ln);border-radius:8px;overflow:hidden;background:#000}
.tw img{width:100%;height:100%;object-fit:cover;display:block}
.tw button{position:absolute;top:3px;right:3px;padding:1px 7px;font-size:11px;background:var(--er);border-color:var(--er);color:#fff;border-radius:6px}
.iout{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.iw{background:#0a0d13;border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.iw img{width:100%;display:block;background:#000;cursor:zoom-in}
.iw .row{padding:8px;gap:6px}
.iw .row button{padding:6px 10px;font-size:11px;flex:1}
.gc{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.gc button.sel{background:var(--a);border-color:var(--a);color:#fff}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--a2);border-top-color:transparent;border-radius:50%;animation:r .8s linear infinite;vertical-align:-3px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
#lightbox.on{display:flex}
#lightbox img{max-width:100%;max-height:90vh;border-radius:8px}
#lightbox button{position:absolute;top:16px;right:16px}
</style>
</head>
<body>

<h1>Studio Créatif</h1>
<p class="sub">Génération · Templates pro · Image libre</p>

<div class="box ok" id="apiBox">
  <label class="lbl">Clé API Agnès</label>
  <input type="password" id="apiKeyInput" placeholder="sk-...">
  <div style="display:flex; gap:0.5rem; margin-top:8px">
    <button id="saveKeyBtn" style="flex:1;">Enregistrer la clé</button>
    <button id="testKeyBtn" style="flex:1; background:#7c3aed;">Tester la clé</button>
  </div>
  <div class="diag" id="apiDiag">Initialisation du script...</div>
</div>

<div class="tabs">
  <div class="tab active" data-tab="p1">📖 Histoire</div>
  <div class="tab" data-tab="p2">🎨 Images</div>
  <div class="tab" data-tab="p3">🎯 Templates</div>
  <div class="tab" data-tab="p4">🎬 Vidéos</div>
</div>

<!-- ═══════════════════ ONGLET 1 : HISTOIRE ═══════════════════ -->
<div class="panel active" id="p1">
  <div class="box">
    <label class="lbl">Titre de l'histoire</label>
    <input type="text" id="storyTitle" placeholder="Ex: Course poursuite à Paris">
  </div>
  <div class="row">
    <div class="box">
      <label class="lbl">Durée par vidéo</label>
      <select id="storyDuration">
        <option value="4">4 secondes</option>
        <option value="6" selected>6 secondes</option>
        <option value="8">8 secondes</option>
        <option value="10">10 secondes</option>
        <option value="12">12 secondes</option>
      </select>
    </div>
    <div class="box">
      <label class="lbl">Style visuel</label>
      <select id="globalStyle">
        <option value="realistic" selected>📸 Réaliste photographie pro</option>
        <option value="ghibli">🌿 Studio Ghibli</option>
        <option value="anime">🗾 Anime japonaise</option>
        <option value="pixar">✨ Pixar 3D</option>
        <option value="disney">🏰 Disney 2D</option>
        <option value="cartoon">🎨 Cartoon 2D</option>
        <option value="netflix">🎬 Netflix cinématique</option>
      </select>
    </div>
  </div>
  <div class="diag" id="log">Prêt.</div>
  <div id="scenesList"></div>
  <button id="addSceneBtn">＋ Ajouter une scène</button>
  <button class="purple" id="generateBtn" disabled>🎬 Générer l'histoire</button>
  <button id="stopBtn" style="display:none;background:#fff;color:#c0392b;border:1px solid #c0392b">⏹ Arrêter</button>
  <div class="timer" id="timerBox">
    <div class="tv" id="timerVal">00:00</div>
    <div class="tl" id="timerLbl">Prêt</div>
    <div class="pb"><div class="pb-f" id="progressFill"></div></div>
  </div>
</div>

<!-- ═══════════════════ ONGLET 2 : IMAGES (NOUVEAU) ═══════════════════ -->
<div class="panel" id="p2">
  <div class="box">
    <label class="lbl">Photos de référence <small style="text-transform:none;letter-spacing:0;color:var(--dim)">(optionnel · jusqu'à 4)</small></label>
    <label class="drop" for="imgFiles">
      <b>📷 Ajouter des photos</b>
      <small>Cliquez ici ou déposez vos fichiers (JPG / PNG, max 8 Mo)</small>
      <input type="file" id="imgFiles" accept="image/*" multiple hidden>
    </label>
    <div class="thumbs" id="imgThumbs"></div>
  </div>

  <div class="box">
    <label class="lbl">Prompt — décrivez votre image</label>
    <textarea id="imgPrompt" placeholder="Ex : un renard cyberpunk dans une ruelle néon sous la pluie, reflets au sol, ambiance Blade Runner…"></textarea>
  </div>

  <div class="box">
    <label class="lbl">Style (optionnel)</label>
    <input type="text" id="imgStyle" placeholder="Ex : cinematic, 35mm, golden hour, hyperrealistic">
  </div>

  <div class="box">
    <label class="lbl">Format</label>
    <div class="gc" id="imgRatioC">
      <button data-r="1:1" class="sel">Carré 1:1</button>
      <button data-r="16:9">Paysage 16:9</button>
      <button data-r="9:16">Portrait 9:16</button>
    </div>
  </div>

  <div class="row">
    <button class="purple" id="imgGenBtn" style="flex:2">🎨 Générer l'image</button>
    <button id="imgClearBtn" style="flex:1">🗑 Tout effacer</button>
  </div>

  <div class="diag" id="imgLog">Prêt.</div>

  <div class="box">
    <label class="lbl">Résultats</label>
    <div class="iout" id="imgResults"><div class="empty">Aucune image pour l'instant</div></div>
  </div>
</div>

<!-- ═══════════════════ ONGLET 3 : TEMPLATES ═══════════════════ -->
<div class="panel" id="p3">
  <div class="box">
    <div class="empty">Bibliothèque de prompts (bientôt disponible)</div>
  </div>
</div>

<!-- ═══════════════════ ONGLET 4 : VIDÉOS ═══════════════════ -->
<div class="panel" id="p4">
  <div class="box">
    <label class="lbl">Vidéos générées</label>
    <div class="gallery" id="gallery"><div class="empty">Aucune vidéo</div></div>
  </div>
</div>

<div class="toast" id="toast"></div>
<div id="lightbox"><img id="lbImg" alt=""><button id="lbClose">✕ Fermer</button></div>

<script>
/* ═════════════════════════════════════════════════════════════════════
   CONFIG
   ═════════════════════════════════════════════════════════════════════ */
const API = 'https://apihub.agnes-ai.com/v1';
const MODEL_IMG = 'agnes-image-2.5-flash';
const MODEL_TXT = 'agnes-3.0-flash';

/* ═════════════════════════════════════════════════════════════════════
   UTILS
   ═════════════════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sleep = ms => new Promise(r => setTimeout(r, ms));

function toast(m, t){
  const d = document.createElement('div');
  d.textContent = m;
  if(t) d.style.color = t;
  $('#toast').appendChild(d);
  setTimeout(() => d.remove(), 3600);
}
function setLog(el, txt, cls){
  const e = $(el);
  e.className = 'diag' + (cls ? ' '+cls : '');
  e.textContent = txt;
}
function logLine(el, txt){
  const e = $(el);
  const line = '[' + new Date().toLocaleTimeString('fr-FR') + '] ' + txt + '\n';
  e.textContent += line;
  e.scrollTop = e.scrollHeight;
}

/* ═════════════════════════════════════════════════════════════════════
   CLÉ API — stockage local
   ═════════════════════════════════════════════════════════════════════ */
const KEY_STORAGE = 'studio_agnes_key';
let apiKey = localStorage.getItem(KEY_STORAGE) || '';
if(apiKey) $('#apiKeyInput').value = apiKey;
refreshApiDiag();

function refreshApiDiag(){
  const d = $('#apiDiag');
  if(!apiKey){
    d.className = 'diag';
    d.textContent = 'Aucune clé enregistrée. Collez votre clé Agnès ci-dessus.';
  } else {
    d.className = 'diag ok';
    d.textContent = '✓ Clé enregistrée : …' + apiKey.slice(-4);
  }
}

$('#saveKeyBtn').onclick = () => {
  const v = $('#apiKeyInput').value.trim();
  if(v.length < 8) return toast('Clé trop courte', '#ff8a8a');
  apiKey = v;
  localStorage.setItem(KEY_STORAGE, v);
  refreshApiDiag();
  toast('✓ Clé enregistrée');
};

$('#testKeyBtn').onclick = async () => {
  const v = $('#apiKeyInput').value.trim();
  if(!v) return toast('Entrez une clé d\'abord', '#ff8a8a');
  setLog('#apiDiag', 'Test de la clé en cours…');
  try{
    const r = await fetch(API + '/models', { headers: { Authorization: 'Bearer ' + v } });
    if(r.ok){
      setLog('#apiDiag', '✓ Clé valide · HTTP ' + r.status, 'ok');
      toast('✓ Clé valide');
    } else {
      const t = (await r.text()).slice(0, 200);
      setLog('#apiDiag', '✕ HTTP ' + r.status + '\n' + t, 'er');
    }
  } catch(e){
    setLog('#apiDiag', '✕ Erreur réseau : ' + e.message, 'er');
  }
};

/* ═════════════════════════════════════════════════════════════════════
   TABS
   ═════════════════════════════════════════════════════════════════════ */
$$('.tab').forEach(t => t.onclick = () => {
  $$('.tab').forEach(x => x.classList.remove('active'));
  $$('.panel').forEach(x => x.classList.remove('active'));
  t.classList.add('active');
  $('#' + t.dataset.tab).classList.add('active');
});

/* ═════════════════════════════════════════════════════════════════════
   ONGLET IMAGES — état
   ═════════════════════════════════════════════════════════════════════ */
const IMG = { refs: [], results: [], ratio: '1:1' };

/* --- Format --- */
$$('#imgRatioC button').forEach(b => b.onclick = () => {
  $$('#imgRatioC button').forEach(x => x.classList.remove('sel'));
  b.classList.add('sel');
  IMG.ratio = b.dataset.r;
});

/* --- Photos --- */
$('#imgFiles').onchange = async e => {
  const files = [...e.target.files].slice(0, 4);
  e.target.value = '';
  for(const f of files){
    if(IMG.refs.length >= 4){ toast('Maximum 4 photos', '#ffc477'); break; }
    if(!f.type.startsWith('image/')) continue;
    if(f.size > 8 * 1024 * 1024){ toast('Trop lourd : ' + f.name, '#ff8a8a'); continue; }
    try{
      const im = await readFile(f, 1024);
      if(im) IMG.refs.push({ id: uid(), u: im.u, d: im.d, name: f.name });
    } catch(err){ logLine('#imgLog', 'Erreur lecture : ' + err.message); }
  }
  renderThumbs();
};

function renderThumbs(){
  $('#imgThumbs').innerHTML = IMG.refs.map(r =>
    `<div class="tw"><img src="${r.u}" alt=""><button data-rm="${r.id}">✕</button></div>`
  ).join('');
  $$('#imgThumbs [data-rm]').forEach(b => b.onclick = () => {
    IMG.refs = IMG.refs.filter(x => x.id !== b.dataset.rm);
    renderThumbs();
  });
}

function readFile(file, maxSide){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, maxSide / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * s);
        c.height = Math.round(im.height * s);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        const d = c.toDataURL('image/jpeg', 0.85);
        res({ u: d, d });
      };
      im.onerror = () => rej(new Error('Image illisible'));
      im.src = fr.result;
    };
    fr.onerror = () => rej(new Error('Lecture impossible'));
    fr.readAsDataURL(file);
  });
}

/* --- Génération --- */
$('#imgGenBtn').onclick = async () => {
  const prompt = $('#imgPrompt').value.trim();
  const style  = $('#imgStyle').value.trim();
  if(!prompt) return toast('Écrivez un prompt', '#ff8a8a');
  if(!apiKey)  return toast('Enregistrez d\'abord votre clé API', '#ff8a8a');

  const btn = $('#imgGenBtn');
  btn.disabled = true;
  const oldLabel = btn.textContent;
  btn.innerHTML = '<span class="spinner"></span>Génération…';

  $('#imgLog').textContent = '';
  logLine('#imgLog', 'Préparation de ' + IMG.refs.length + ' référence(s)…');
  logLine('#imgLog', 'Prompt : ' + prompt.slice(0, 100));
  logLine('#imgLog', 'Format : ' + IMG.ratio);

  try{
    const fullPrompt = [prompt, style, 'high quality, detailed, cinematic lighting']
      .filter(Boolean).join(', ');

    const size = IMG.ratio === '16:9' ? '1344x768'
               : IMG.ratio === '9:16' ? '768x1344'
               : '1024x1024';

    const body = {
      model: MODEL_IMG,
      prompt: fullPrompt,
      n: 1,
      size,
      response_format: 'b64_json'
    };
    if(IMG.refs.length){
      body.image = IMG.refs.map(r => r.d);
      body.strength = 0.65;
      logLine('#imgLog', 'Mode img2img activé (inspiration depuis les photos)');
    }

    logLine('#imgLog', 'Envoi à Agnès…');
    const r = await fetch(API + '/images/generations', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: 'Bearer ' + apiKey
      },
      body: JSON.stringify(body)
    });

    if(!r.ok){
      const t = (await r.text()).slice(0, 300);
      throw new Error('HTTP ' + r.status + ' — ' + t);
    }

    const d = await r.json();
    const data = d.data || [];
    if(!data.length) throw new Error('Aucune image renvoyée');

    let count = 0;
    for(const it of data){
      let url = it.url;
      if(!url && it.b64_json) url = 'data:image/png;base64,' + it.b64_json;
      if(!url) continue;
      IMG.results.unshift({
        id: uid(),
        u: url,
        d: url.indexOf('data:') === 0 ? url : null,
        prompt: fullPrompt,
        ratio: IMG.ratio,
        date: Date.now()
      });
      count++;
    }

    if(!count) throw new Error('Format de réponse inattendu');
    logLine('#imgLog', '✓ ' + count + ' image(s) générée(s)');
    setLog('#imgLog', '✓ Succès', 'ok');
    renderResults();
    toast('🎨 Image générée');
  } catch(err){
    logLine('#imgLog', '✕ ' + err.message);
    setLog('#imgLog', '✕ Erreur — ' + err.message.slice(0, 160), 'er');
    toast('Erreur : ' + err.message.slice(0, 80), '#ff8a8a');
  } finally {
    btn.disabled = false;
    btn.textContent = oldLabel;
  }
};

$('#imgClearBtn').onclick = () => {
  if(!confirm('Tout effacer (photos, prompt, résultats) ?')) return;
  IMG.refs = []; IMG.results = [];
  $('#imgPrompt').value = '';
  $('#imgStyle').value = '';
  renderThumbs();
  renderResults();
  setLog('#imgLog', 'Studio réinitialisé.');
  toast('Effacé');
};

/* --- Affichage des résultats --- */
function renderResults(){
  const host = $('#imgResults');
  if(!IMG.results.length){
    host.innerHTML = '<div class="empty">Aucune image pour l\'instant</div>';
    return;
  }
  host.innerHTML = IMG.results.map((im, i) => {
    const ar = im.ratio.replace(':', '/');
    return `<div class="iw" data-i="${i}">
      <img src="${im.u}" alt="" style="aspect-ratio:${ar}" data-zoom="${i}">
      <div class="row">
        <button data-dl="${i}">⬇</button>
        <button data-ref="${i}">+ Réf</button>
        <button data-rm="${i}">🗑</button>
      </div>
    </div>`;
  }).join('');
